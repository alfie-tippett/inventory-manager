<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Stock</title>
    <style>
        input {
            width: 30%;
            border-radius: 8px;
        }
        div {
            align-items: center;
            padding-left: 25%;
            padding-right: 25%;
            padding-top: 5%;
        }
        
        input[type=button], input[type=submit], input[type=reset] {
            border: none;
            cursor: pointer;
            border-radius: 5px;
            padding: 16px 32px;
            margin: 4px 2px;
        }
    </style>
</head>

<body>
    <div>
        <form action="/remove_stock" method="POST">
            <label for="id_num">ID:</label>
            <input type="number" id="id_num" name="id_num">
            <br>
            <h3>OR</h3>
            <label for="model">Model: </label>
            <input type="text" id="model" name="model">
            <br>
            <label for="serial_num">Serial Number:</label>
            <input type="text" id="serial_num" name="serial_num">
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
